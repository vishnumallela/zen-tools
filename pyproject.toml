[project]
name = "zen-tools"
version = "0.1.0"
description = "One MCP endpoint. Any tool combination. Each agent gets exactly what it needs."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "firecrawl-py>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "anyio>=4.0",
    "pydantic>=2.12.5",
]

[project.scripts]
zen-tools = "zen_tools.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["zen_tools"]

[tool.ruff.lint.per-file-ignores]
"src/zen_tools/docs.py" = ["E501"]
"src/zen_tools/tools/__init__.py" = ["E501"]

[tool.ty]
python-version = "3.12"
